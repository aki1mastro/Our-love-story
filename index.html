<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сабина и Аким | Наша История</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <h1>Сабина <span id="secret-trigger" style="cursor: pointer;">&</span> Аким</h1>
            <p>История нашей любви</p>
            <div class="counter-box">
                <span id="days-count">0</span>
                <span class="label">Дней вместе</span>
            </div>
        </div>
    </header>

    <div class="tracker-container">
        <div class="tracker-box">
            <h3 id="tracker-status">Загрузка статуса...</h3>
            <div class="progress-bar-bg" id="progress-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
            <p id="tracker-days" class="tracker-days"></p>
        </div>
    </div>

    <section class="timeline" id="timeline-container">
        </section>

    <section class="map-section">
        <h2 style="text-align: center; font-family: 'Montserrat', sans-serif; font-size: 2rem; color: #2d3436; margin-bottom: 20px;">Наши места</h2>
        <div id="love-map"></div>
    </section>

    <button id="add-map-btn" class="add-map-btn" title="Добавить место на карту">📍</button>
    <button id="add-btn" class="add-btn" title="Добавить историю">+</button>

    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 style="margin-top: 0; color: #2d3436;">Новое воспоминание</h2>
            
            <input type="date" id="new-date" required>
            <input type="text" id="new-title" placeholder="Заголовок (например: Наша поездка)" required>
            <textarea id="new-text" placeholder="История..." rows="4" required></textarea>
            
            <label style="font-size: 0.9rem; color: #636e72; margin-top: 10px; display: block;">Прикрепить фото (необязательно):</label>
            <input type="file" id="new-image" accept="image/*" style="padding: 10px 5px; width: 100%;">

            <input type="password" id="new-password" placeholder="Секретный пароль" required>
            
            <button id="submit-memory" class="save-btn">Сохранить</button>
            <p id="status-msg" style="text-align: center; color: #ff4b72; font-size: 0.9rem; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <div id="add-map-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-map-modal">&times;</span>
            <h2 style="margin-top: 0; color: #2d3436;">Новое место</h2>
            
            <input type="text" id="new-map-title" placeholder="Название (например: БАО)" required>
            <textarea id="new-map-desc" placeholder="Описание (Что там было?)" rows="2" required></textarea>
            
            <p style="font-size: 0.9rem; color: #636e72; margin-top: 10px; margin-bottom: 5px;">📍 Тапни на карту, чтобы поставить метку:</p>
            <div id="mini-map" style="height: 180px; width: 100%; border-radius: 10px; border: 1px solid #dfe6e9; margin-bottom: 10px; z-index: 1;"></div>
            
            <input type="hidden" id="new-map-lat">
            <input type="hidden" id="new-map-lng">

            <input type="password" id="new-map-password" placeholder="Секретный пароль" required>
            
            <button id="submit-map-marker" class="save-btn" style="background: #0984e3;">Добавить на карту</button>
            <p id="map-status-msg" style="text-align: center; color: #0984e3; font-size: 0.9rem; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <div id="love-modal" class="modal">
        <div class="modal-content" style="text-align: center; padding: 40px 20px;">
            <span class="close-btn" id="close-love-modal">&times;</span>
            <h2 style="font-size: 3.5rem; margin: 0 0 15px 0;">❤️</h2>
            <p id="love-reason-text" style="font-size: 1.2rem; font-weight: 500; color: #2d3436; line-height: 1.6;"></p>
        </div>
    </div>

    <section class="stats">
        <div class="stats-grid">
            <div class="stat-item">
                <h3>1</h3>
                <p>Любовь на двоих</p>
            </div>
            <div class="stat-item">
                <h3>10000+</h3>
                <p>Сообщений</p>
            </div>
            <div class="stat-item">
                <h3>∞</h3>
                <p>Счастливых моментов</p>
            </div>
        </div>
    </section>

    <footer>
        <p>Created with ❤️ for Sabina</p>
        <p style="font-size: 0.8rem; opacity: 0.7;">2026</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBi-chMoOpwQsTq9MWqxJ_qXuNDyMM5NpY",
            authDomain: "love-story-2fe60.firebaseapp.com",
            projectId: "love-story-2fe60",
            storageBucket: "love-story-2fe60.firebasestorage.app",
            messagingSenderId: "938943940362",
            appId: "1:938943940362:web:f401a16b3cf322ccaa1cf3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app); 

        const SECRET_PASSWORD = "1404"; 
        const container = document.getElementById('timeline-container');

        // ==========================================
        // НАСТРОЙКИ TELEGRAM БОТА (ВСТАВЬ СВОИ ДАННЫЕ)
        // ==========================================
        const TELEGRAM_BOT_TOKEN = "8676989738:AAEWlwAMKJVBmrmAWrYPnQlZXE-zxTiz3lw"; // Например: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
        const TELEGRAM_CHAT_ID = "338255825";              // Например: "123456789"

        async function sendTelegramNotification(text) {
            // Если токен не настроен, просто пропускаем (чтобы сайт не ломался)
            if (TELEGRAM_BOT_TOKEN === "8676989738:AAEWlwAMKJVBmrmAWrYPnQlZXE-zxTiz3lw") return; 
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: text,
                        parse_mode: 'HTML' // Позволяет использовать жирный шрифт в сообщениях
                    })
                });
            } catch (error) {
                console.error("Ошибка отправки в Telegram:", error);
            }
        }
        // ==========================================


        function parseDate(dateStr) {
            if (!dateStr || !dateStr.includes('.')) return new Date();
            const [day, month, year] = dateStr.split('.');
            return new Date(`${year}-${month}-${day}`);
        }

        // --- 1. ЛОГИКА ИСТОРИЙ ---
        function renderTimeline(allData) {
            container.innerHTML = ""; 
            allData.sort((a, b) => parseDate(a.date) - parseDate(b.date));

            allData.forEach((mem, index) => {
                const side = index % 2 === 0 ? 'left' : 'right';
                let contentHtml = '';

                if (mem.type === 'photo') {
                    contentHtml = `
                        <p class="description">${mem.text}</p>
                        <div class="img-container">
                            <img src="${mem.image}" alt="${mem.title}" onerror="this.style.display='none'">
                        </div>
                    `;
                } else if (mem.type === 'event') {
                    contentHtml = `<p class="description event-text">${mem.text}</p>`;
                } else {
                    contentHtml = `<p class="chat-quote"><b>${mem.sender || 'Мы'}:</b> ${mem.text}</p>`;
                }

                const html = `
                    <div class="memory-container ${side}">
                        <div class="content">
                            <div class="date">${mem.date}</div>
                            <h2>${mem.title}</h2>
                            ${contentHtml}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
            checkScroll();
        }

        async function loadAllMemories() {
            let combinedMemories = [];
            try {
                const querySnapshot = await getDocs(collection(db, "user_memories"));
                querySnapshot.forEach((doc) => { combinedMemories.push(doc.data()); });
            } catch (error) { console.error("Ошибка БД:", error); }
            renderTimeline(combinedMemories);
        }

        loadAllMemories();

        // --- 2. ЛОГИКА ГЛАВНОЙ КАРТЫ ---
        async function initAndLoadMap() {
            const mapContainer = document.getElementById('love-map');
            if (!mapContainer) return;

            const map = L.map('love-map', {
                center: [43.2389, 76.8897], 
                zoom: 10,
                zoomControl: true,
                scrollWheelZoom: true 
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            const heartIcon = L.divIcon({
                className: 'custom-map-marker',
                html: '❤️',
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -15]
            });

            window.addEventListener('resize', () => map.invalidateSize());

            try {
                const querySnapshot = await getDocs(collection(db, "map_markers"));
                querySnapshot.forEach((doc) => {
                    const loc = doc.data();
                    if (loc.lat && loc.lng) {
                        const marker = L.marker([loc.lat, loc.lng], {icon: heartIcon}).addTo(map);
                        marker.bindPopup(`
                            <strong style="color: #ff4b72; font-family: 'Montserrat', sans-serif; font-size: 1.1rem;">${loc.title}</strong><br>
                            <span style="font-family: 'Segoe UI', sans-serif; color: #2d3436;">${loc.desc}</span>
                        `);
                    }
                });
            } catch (error) {
                console.error("Ошибка загрузки точек карты:", error);
            }
        }
        initAndLoadMap();

        // --- 3. ЛОГИКА МОДАЛЬНЫХ ОКОН И МИНИ-КАРТЫ ---
        const modal = document.getElementById("add-modal");
        const btn = document.getElementById("add-btn");
        const closeBtn = document.getElementById("close-modal");

        const mapModal = document.getElementById("add-map-modal");
        const mapBtn = document.getElementById("add-map-btn");
        const closeMapBtn = document.getElementById("close-map-modal");

        const loveModal = document.getElementById("love-modal");
        const secretTrigger = document.getElementById("secret-trigger");
        const closeLoveModal = document.getElementById("close-love-modal");

        let miniMap;
        let miniMarker;
        const smallHeartIcon = L.divIcon({
            className: 'custom-map-marker',
            html: '❤️',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        btn.onclick = () => { modal.style.display = "flex"; }
        
        mapBtn.onclick = () => { 
            mapModal.style.display = "flex"; 
            if (!miniMap) {
                miniMap = L.map('mini-map').setView([43.2389, 76.8897], 11);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19
                }).addTo(miniMap);

                miniMap.on('click', function(e) {
                    if (miniMarker) { miniMap.removeLayer(miniMarker); }
                    miniMarker = L.marker(e.latlng, {icon: smallHeartIcon}).addTo(miniMap);
                    document.getElementById('new-map-lat').value = e.latlng.lat;
                    document.getElementById('new-map-lng').value = e.latlng.lng;
                });
            }
            setTimeout(() => { miniMap.invalidateSize(); }, 200);
        }

        secretTrigger.onclick = () => {
            const randomIndex = Math.floor(Math.random() * reasons.length);
            document.getElementById("love-reason-text").innerText = reasons[randomIndex];
            loveModal.style.display = "flex";
        }

        closeBtn.onclick = () => { modal.style.display = "none"; }
        closeMapBtn.onclick = () => { mapModal.style.display = "none"; }
        closeLoveModal.onclick = () => { loveModal.style.display = "none"; }

        window.addEventListener('click', (event) => {
            if (event.target == modal) modal.style.display = "none";
            if (event.target == mapModal) mapModal.style.display = "none";
            if (event.target == loveModal) loveModal.style.display = "none";
        });

        // --- СОХРАНЕНИЕ ИСТОРИИ ---
        document.getElementById("submit-memory").addEventListener("click", async () => {
            const dateVal = document.getElementById("new-date").value;
            const titleVal = document.getElementById("new-title").value;
            const textVal = document.getElementById("new-text").value;
            const passVal = document.getElementById("new-password").value;
            const fileInput = document.getElementById("new-image");
            const statusMsg = document.getElementById("status-msg");

            if (!dateVal || !titleVal || !textVal) { statusMsg.innerText = "Заполните текстовые поля!"; return; }
            if (passVal !== SECRET_PASSWORD) { statusMsg.innerText = "Неверный пароль!"; return; }

            const [year, month, day] = dateVal.split('-');
            const formattedDate = `${day}.${month}.${year}`;
            let imageUrl = ""; let memoryType = "event"; 

            try {
                if (fileInput.files.length > 0) {
                    statusMsg.innerText = "Грузим фото... ⏳";
                    const file = fileInput.files[0];
                    const storageReference = ref(storage, 'memories_photos/' + Date.now() + '_' + file.name);
                    await uploadBytes(storageReference, file);
                    imageUrl = await getDownloadURL(storageReference);
                    memoryType = "photo"; 
                }

                statusMsg.innerText = "Сохраняем... ⏳";
                await addDoc(collection(db, "user_memories"), {
                    date: formattedDate, title: titleVal, text: textVal, type: memoryType, image: imageUrl
                });

                // ОТПРАВЛЯЕМ УВЕДОМЛЕНИЕ В TELEGRAM
                sendTelegramNotification(`❤️ <b>Добавлена новая история!</b>\n\n<b>Дата:</b> ${formattedDate}\n<b>Заголовок:</b> ${titleVal}\n<b>Текст:</b> ${textVal}`);
                
                statusMsg.innerText = "Готово! ❤️";
                setTimeout(() => {
                    modal.style.display = "none";
                    document.getElementById("new-title").value = '';
                    document.getElementById("new-text").value = '';
                    document.getElementById("new-password").value = '';
                    document.getElementById("new-image").value = '';
                    statusMsg.innerText = '';
                    loadAllMemories(); 
                }, 1500);
            } catch (e) { statusMsg.innerText = "Ошибка: " + e.message; }
        });

        // --- СОХРАНЕНИЕ ТОЧКИ НА КАРТУ ---
        document.getElementById("submit-map-marker").addEventListener("click", async () => {
            const titleVal = document.getElementById("new-map-title").value;
            const descVal = document.getElementById("new-map-desc").value;
            const passVal = document.getElementById("new-map-password").value;
            const statusMsg = document.getElementById("map-status-msg");
            
            const latVal = document.getElementById("new-map-lat").value;
            const lngVal = document.getElementById("new-map-lng").value;

            if (!titleVal || !descVal) { statusMsg.innerText = "Заполните название и описание!"; return; }
            if (!latVal || !lngVal) { statusMsg.innerText = "Пожалуйста, тапните на место на мини-карте! 📍"; return; }
            if (passVal !== SECRET_PASSWORD) { statusMsg.innerText = "Неверный пароль!"; return; }

            const lat = parseFloat(latVal);
            const lng = parseFloat(lngVal);

            try {
                statusMsg.innerText = "Отправляем на карту... ⏳";
                await addDoc(collection(db, "map_markers"), {
                    title: titleVal, desc: descVal, lat: lat, lng: lng
                });

                // ОТПРАВЛЯЕМ УВЕДОМЛЕНИЕ В TELEGRAM
                sendTelegramNotification(`📍 <b>Новое место на карте!</b>\n\n<b>Название:</b> ${titleVal}\n<b>Описание:</b> ${descVal}`);
                
                statusMsg.innerText = "Добавлено! 📍 Перезагрузка...";
                setTimeout(() => { window.location.reload(); }, 1500);
            } catch (e) { statusMsg.innerText = "Ошибка: " + e.message; }
        });

        // Анимация прокрутки
        function checkScroll() {
            const items = document.querySelectorAll('.memory-container');
            const triggerBottom = window.innerHeight / 5 * 4;
            items.forEach(item => {
                const itemTop = item.getBoundingClientRect().top;
                if(itemTop < triggerBottom) item.classList.add('show');
            });
        }
        window.addEventListener('scroll', checkScroll);

        const startDate = new Date('2025-05-05');
        const countElement = document.getElementById('days-count');
        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;
            countElement.innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
        }
        updateCounter();

        const reasons = [
            "За твою улыбку, которая с легкостью стирает усталость после долгого рабочего дня.",
            "За то, что мы можем смеяться над чем угодно до слез.",
            "За твой смех, который я готов слушать бесконечно.",
            "За то, что ты понимаешь меня с полуслова и взгляда.",
            "За твою нежность и заботу, которыми ты меня окружаешь.",
            "За то, что рядом с тобой я хочу быть еще лучше.",
            "За твои глаза, в которых можно утонуть.",
            "За то, что ты — мой самый близкий человек и моя главная любовь.",
            "За наши общие мечты и планы на будущее.",
            "За то, что даже просто молчать рядом с тобой — это огромное счастье.",
            "За то, что с тобой самый обычный день превращается в праздник.",
            "За твою невероятную поддержку и тепло, которые греют меня все те две недели, пока я на вахте.",
            "За то, что возвращение домой в субботу после перевахтовки — это лучший день, потому что там ждешь ты.",
            "За то, что моя любовь к тебе работает без ошибок и сбоев, как бесконечный цикл.",
            "За то, что никакая 3D-визуализация не сравнится с тем, какая ты красивая вживую.",
            "За то, что ты всегда веришь в меня и мои проекты.",
            "За то, что даже когда я далеко на работе в праздничные дни, я всегда чувствую твою любовь.",
            "За то, что в интерфейсе моей жизни ты — самый главный и красивый элемент."
        ];

        function updateShiftTracker() {
            const referenceDate = new Date('2026-01-10T00:00:00'); 
            const now = new Date();
            const diffTime = now - referenceDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const cycleDay = diffDays % 28;

            const statusTitle = document.getElementById('tracker-status');
            const progressBar = document.getElementById('progress-bg');
            const progressFill = document.getElementById('progress-fill');
            const daysText = document.getElementById('tracker-days');

            if (cycleDay < 14) {
                const daysLeft = 14 - cycleDay;
                const percentDone = ((cycleDay) / 14) * 100;
                statusTitle.innerText = "До наших обнимашек осталось:";
                progressBar.style.display = "block";
                setTimeout(() => { progressFill.style.width = percentDone + "%"; }, 100);
                daysText.innerText = `${daysLeft} дн.`;
            } else {
                statusTitle.innerText = "Наслаждаемся каждой минутой вместе ✨";
                progressBar.style.display = "none";
                daysText.innerText = "";
            }
        }
        updateShiftTracker();
    </script>
</body>
</html>
